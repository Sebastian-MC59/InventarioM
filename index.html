<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de activos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#1b2430;--mute:#66717f;--line:#d5dae0;--acc:#2f5d8a;--acc-ink:#fff;--soft:#e3ebf3;--ok:#1f7a4d;--warn:#a86a00;--bad:#b3362b;--off:#6b7280;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b22;--card:#1f262f;--ink:#e6eaf0;--mute:#9aa5b3;--line:#323b47;--acc:#6ea3d6;--acc-ink:#0f1720;--soft:#263344;--ok:#4cc38a;--warn:#e0a53a;--bad:#ef7b70;--off:#9aa5b3}}
:root[data-theme="dark"]{--bg:#161b22;--card:#1f262f;--ink:#e6eaf0;--mute:#9aa5b3;--line:#323b47;--acc:#6ea3d6;--acc-ink:#0f1720;--soft:#263344;--ok:#4cc38a;--warn:#e0a53a;--bad:#ef7b70;--off:#9aa5b3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
.dan{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tools input,.tools select{flex:1 1 160px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;padding:5px 11px;font-size:13px;border-radius:999px}
.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--soft);object-fit:cover;display:grid;place-items:center;color:var(--mute);font-size:11px}
.code{font-weight:600;font-size:13px;color:var(--acc)}
.name{font-weight:500}
.meta{color:var(--mute);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.acts{display:flex;gap:6px;flex-direction:column}
.acts button{padding:4px 10px;font-size:13px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:36px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(680px,94vw);max-height:92vh;padding:0}
dialog::backdrop{background:rgba(10,15,20,.55)}
form{padding:18px}
form h2{margin:0 0 14px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.drop{border:2px dashed var(--line);border-radius:8px;background:var(--card);min-height:150px;display:grid;place-items:center;text-align:center;color:var(--mute);cursor:pointer;position:relative;overflow:hidden;padding:10px}
.drop.over{border-color:var(--acc);background:var(--soft);color:var(--ink)}
.drop img{max-width:100%;max-height:220px;border-radius:4px;display:block}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.small{font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.row{grid-template-columns:52px 1fr}.thumb{width:52px;height:52px}.acts{grid-column:1/-1;flex-direction:row}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Inventario de activos</h1><div class="sub" id="count"></div></div>
  <button class="pri" id="add">Agregar activo</button>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="Buscar por código, marca, serie, responsable…" aria-label="Buscar">
  <select id="fe" aria-label="Filtrar por estado"></select>
</div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<p class="sub small">Los datos se guardan en este navegador. Las fotos se reducen automáticamente.</p>
</main>

<dialog id="dlg">
<form id="f" method="dialog" onsubmit="return false">
  <h2 id="ft">Nuevo activo</h2>
  <div class="grid">
    <div><label for="categoria">Categoría</label><select id="categoria"></select></div>
    <div><label for="codigo">Código</label><input id="codigo" required></div>
    <div><label for="marca">Marca</label><input id="marca"></div>
    <div><label for="modelo">Modelo</label><input id="modelo"></div>
    <div><label for="serie">Serie</label><input id="serie"></div>
    <div><label for="estado">Estado</label><select id="estado"></select></div>
    <div><label for="empresa">Empresa</label><input id="empresa"></div>
    <div><label for="responsable">Responsable</label><input id="responsable"></div>
    <div><label for="ubicacion">Ubicación</label><input id="ubicacion"></div>
    <div><label for="sitio">Sitio</label><input id="sitio"></div>
    <div class="full"><label>Foto</label>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Arrastrar una foto o hacer clic para elegirla">
        <div id="dropin">Arrastra la foto aquí<br><span class="small">o haz clic para elegirla. También puedes pegarla con Ctrl+V.</span></div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <button type="button" id="rmfoto" class="small" style="margin-top:6px;display:none">Quitar foto</button>
    </div>
  </div>
  <div class="foot"><button type="button" id="cancel">Cancelar</button><button type="button" class="pri" id="save">Guardar activo</button></div>
</form>
</dialog>

<script>
const CATS={"Licencia/Software":"LIC","Mobiliario":"MOB","Vehículo":"VEH","Herramienta":"HER","Equipo de taller":"TAL","Telefonía":"TEL","Servidor/NAS":"SRV","Activo y equipo":"ACT"};
const EST={"En uso":"--ok","Disponible":"--acc","En reparación":"--warn","Dado de baja":"--off"};
const $=id=>document.getElementById(id);
let items=[],editing=null,foto="",cat="Todas",autoCode=true;
try{items=JSON.parse(localStorage.getItem("inv-activos")||"[]")}catch(e){items=[]}
function persist(){try{localStorage.setItem("inv-activos",JSON.stringify(items))}catch(e){alert("No se pudo guardar: la foto puede ser muy grande o el almacenamiento está lleno.")}}
$("categoria").innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join("");
$("estado").innerHTML=Object.keys(EST).map(c=>`<option>${c}</option>`).join("");
$("fe").innerHTML='<option value="">Todos los estados</option>'+Object.keys(EST).map(c=>`<option>${c}</option>`).join("");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function nextCode(c){const p=CATS[c];const n=items.filter(i=>i.codigo.startsWith(p+"-")).map(i=>parseInt(i.codigo.slice(4))||0);return p+"-"+String(Math.max(0,...n)+1).padStart(3,"0")}
function render(){
  const q=$("q").value.toLowerCase(),fe=$("fe").value;
  $("tabs").innerHTML=["Todas",...Object.keys(CATS)].map(c=>{const n=c=="Todas"?items.length:items.filter(i=>i.categoria==c).length;return `<button class="${c==cat?"on":""}" data-c="${c}">${c} (${n})</button>`}).join("");
  const res=items.filter(i=>(cat=="Todas"||i.categoria==cat)&&(!fe||i.estado==fe)&&(!q||Object.values(i).some(v=>typeof v=="string"&&v.length<200&&v.toLowerCase().includes(q))));
  $("count").textContent=items.length+(items.length==1?" activo registrado":" activos registrados");
  $("list").innerHTML=res.length?res.map(i=>`<div class="row">
    ${i.foto?`<img class="thumb" src="${i.foto}" alt="">`:`<div class="thumb">Sin foto</div>`}
    <div><div><span class="code">${esc(i.codigo)}</span> <span class="badge" style="color:var(${EST[i.estado]})">${esc(i.estado)}</span></div>
    <div class="name">${esc([i.marca,i.modelo].filter(Boolean).join(" ")||i.categoria)}</div>
    <div class="meta">${esc(i.categoria)}${i.serie?" · Serie "+esc(i.serie):""}</div>
    <div class="meta">${esc([i.empresa,i.ubicacion,i.sitio].filter(Boolean).join(" / "))}${i.responsable?" — "+esc(i.responsable):""}</div></div>
    <div class="acts"><button data-e="${i.id}">Editar</button><button class="dan" data-d="${i.id}">Eliminar</button></div></div>`).join("")
  :`<div class="empty">${items.length?"Ningún activo coincide con la búsqueda.":"Aún no hay activos. Agrega el primero con el botón de arriba."}</div>`;
}
function showFoto(){
  $("dropin").innerHTML=foto?`<img src="${foto}" alt="Foto del activo">`:'Arrastra la foto aquí<br><span class="small">o haz clic para elegirla. También puedes pegarla con Ctrl+V.</span>';
  $("rmfoto").style.display=foto?"":"none";
}
function loadImg(file){
  if(!file||!file.type.startsWith("image/"))return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=640,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);foto=c.toDataURL("image/jpeg",.78);showFoto()};im.src=r.result};
  r.readAsDataURL(file);
}
function open_(id){
  editing=id;const i=items.find(x=>x.id==id)||{};
  $("ft").textContent=id?"Editar activo":"Nuevo activo";
  ["categoria","codigo","marca","modelo","serie","empresa","ubicacion","sitio","responsable","estado"].forEach(k=>$(k).value=i[k]||(k=="categoria"?Object.keys(CATS)[0]:k=="estado"?"En uso":""));
  if(!id){$("codigo").value=nextCode($("categoria").value)}
  autoCode=!id;foto=i.foto||"";showFoto();$("dlg").showModal();
}
$("add").onclick=()=>open_(null);
$("cancel").onclick=()=>$("dlg").close();
$("categoria").onchange=()=>{if(autoCode)$("codigo").value=nextCode($("categoria").value)};
$("codigo").oninput=()=>autoCode=false;
$("save").onclick=()=>{
  if(!$("codigo").value.trim()){$("codigo").focus();return}
  const d={foto};["categoria","codigo","marca","modelo","serie","empresa","ubicacion","sitio","responsable","estado"].forEach(k=>d[k]=$(k).value.trim());
  if(editing){items=items.map(x=>x.id==editing?{...d,id:editing}:x)}else items.unshift({...d,id:Date.now()});
  persist();$("dlg").close();render();
};
$("list").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)open_(+b.dataset.e);
  if(b.dataset.d&&confirm("¿Eliminar este activo? Esta acción no se puede deshacer.")){items=items.filter(x=>x.id!=b.dataset.d);persist();render()}
};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("q").oninput=render;$("fe").onchange=render;
const dz=$("drop");
dz.onclick=()=>$("file").click();
dz.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();$("file").click()}};
$("file").onchange=e=>loadImg(e.target.files[0]);
["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>loadImg(e.dataTransfer.files[0]));
$("dlg").addEventListener("paste",e=>{const f=[...e.clipboardData.files][0];if(f)loadImg(f)});
$("rmfoto").onclick=()=>{foto="";showFoto()};
render();
</script>
</body>
</html>
